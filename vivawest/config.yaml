name: "Vivawest"
description: "Liest Heizungs- und Wasserverbräuche sowie Miete und Vorauszahlungen aus dem Vivawest Kundenportal und stellt sie in Home Assistant bereit."
version: "1.2.0"
slug: "vivawest"
init: false
homeassistant_api: true

arch:
  - aarch64
  - amd64
  - armv7

options:
  login: ""
  password: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  poll_interval_hours: 12
  import_statistics: true

schema:
  login: str
  password: password
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  poll_interval_hours: int
  import_statistics: bool
